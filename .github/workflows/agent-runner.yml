name: Hud Agent Runner

on:
  workflow_call:
    inputs:
      base-url:
        description: 'Base URL of the Hud API (used for action API calls; also used for MCP if mcp-base-url is not set)'
        required: false
        type: string
        default: 'https://api-prod.hud.io'
      mcp-base-url:
        description: 'Base URL for the Hud MCP server. Falls back to base-url when omitted.'
        required: false
        type: string
        default: ''
      mcp-runner:
        description: 'Override-only. Command (npx or bunx) used to launch hud-mcp instead of the bundled MCP.'
        required: false
        type: string
        default: ''
      mcp-version:
        description: 'Override-only. Version of hud-mcp to install when mcp-runner is set, e.g. v2 or 1.2.3.'
        required: false
        type: string
        default: ''
      hud-audience:
        description: 'OIDC audience for the GitHub→Hud token exchange.'
        required: false
        type: string
        default: ''
      extra-env:
        description: |
          Comma-separated list of additional process.env keys to forward into
          the Claude Code subprocess on top of the built-in allowlist (PATH,
          HOME, TMPDIR, USER, SHELL, TERM).
        required: false
        type: string
        default: ''
    outputs:
      has_tasks:
        description: 'Whether pending tasks were found in this run'
        value: ${{ jobs.fetch-tasks.outputs.has_tasks }}
    secrets:
      anthropic-api-key:
        description: 'Anthropic API key'
        required: true
      github-token:
        description: 'GitHub token with repo write access for branch/PR operations'
        required: true
      hud-mcp-key:
        description: |
          Optional static Hud MCP key. When provided, it is forwarded to
          hud-mcp as HUD_MCP_KEY (server-side exchanged via /auth/m2m/login)
          instead of the GitHub OIDC-derived HUD_ACCESS_TOKEN. The Workflow
          Manager calls (task fetch/report) still use GitHub OIDC.
        required: false
      langfuse-secret-key:
        description: 'Langfuse secret key for tracing (optional)'
        required: false
      langfuse-public-key:
        description: 'Langfuse public key for tracing (optional)'
        required: false

# Authentication: every job here uses GitHub OIDC to obtain short-lived Hud
# Auth0 tokens. There is no static-secret fallback: callers must grant
# `permissions: id-token: write` on the calling job.
#
# NOTE: Continuation logic (self-dispatch, concurrency group) lives in the
# caller workflow rather than here. We considered moving it into this reusable
# workflow to keep the caller minimal, but that would require passing a token
# with `actions: write` permission into an agentic workflow — a security risk
# since the agent steps could use that token to trigger arbitrary workflow runs.

# Secret-masking note: the GitHub Actions runner scans every write to
# $GITHUB_OUTPUT and $GITHUB_ENV against its mask set (both explicit secrets
# and pattern-based auto-detection of JWT / PAT / AWS-key shapes) and drops
# outputs that match. Pending tasks contain freeform agent text (prompts,
# bodies, plans, root causes) that regularly trips that check, leaving
# matrix expansion with an empty input and crashing strategy evaluation.
#
# To avoid that, all freeform fields travel via files (tasks.json artifact +
# /tmp/task-fields/) which the masker does not scan, and only safe structural
# fields (integer task ids, enum types, branch names, model slugs, file
# paths) cross $GITHUB_OUTPUT / env: blocks.

jobs:
  fetch-tasks:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      has_tasks: ${{ steps.fetch.outputs.has_tasks }}
      task_ids: ${{ steps.fetch.outputs.task_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: code-hud/agent-runner
          path: .agent-runner
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve Hud tokens (GitHub OIDC)
        id: hud-tokens
        run: node .agent-runner/fetch-tokens.js
        env:
          HUD_BASE_URL: ${{ inputs.base-url || 'https://api-prod.hud.io' }}
          HUD_AUDIENCE: ${{ inputs.hud-audience }}

      - name: Fetch pending tasks
        id: fetch
        env:
          HUD_TOKEN: ${{ steps.hud-tokens.outputs.workflow_manager_token }}
          HUD_BASE_URL: ${{ inputs.base-url || 'https://api-prod.hud.io' }}
        run: |
          curl -s -f \
            -H "Authorization: Bearer $HUD_TOKEN" \
            "$HUD_BASE_URL/workflow-manager/tasks/pending?limit=10" \
            > tasks.json

          TASK_COUNT=$(jq '. | length' tasks.json)
          TASK_IDS=$(jq -c '[.[].id]' tasks.json)
          # task_ids is an array of integers - cannot match any secret pattern.
          echo "task_ids=$TASK_IDS" >> "$GITHUB_OUTPUT"
          echo "has_tasks=$([ "$TASK_COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload tasks artifact
        if: steps.fetch.outputs.has_tasks == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pending-tasks
          path: tasks.json
          retention-days: 1
          if-no-files-found: error

  execute-task:
    needs: fetch-tasks
    if: needs.fetch-tasks.outputs.has_tasks == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        task_id: ${{ fromJSON(needs.fetch-tasks.outputs.task_ids) }}
    env:
      TASK_FIELDS_DIR: /tmp/task-fields
    steps:
      # tasks.json and task-fields live under /tmp so actions/checkout's
      # default clean does not wipe them when the user repo is checked out
      # later in the job.
      - uses: actions/download-artifact@v4
        with:
          name: pending-tasks
          path: /tmp/task-artifact

      - name: Load task fields
        id: load
        run: |
          mkdir -p "$TASK_FIELDS_DIR"
          TASK=$(jq -c --argjson id "${{ matrix.task_id }}" '.[] | select(.id == $id)' /tmp/task-artifact/tasks.json)
          if [ -z "$TASK" ]; then
            echo "::error::task_id ${{ matrix.task_id }} not found in tasks.json"
            exit 1
          fi
          # The whole task object goes to a file; downstream steps (agent.js,
          # Create PR) pick the fields they need from there. Freeform content
          # never crosses $GITHUB_OUTPUT or env: blocks (both scanned by the
          # runner's secret masker).
          echo "$TASK" > "$TASK_FIELDS_DIR/task.json"
          : > "$TASK_FIELDS_DIR/result.json"
          # Structural fields are short, enum-like, or numeric - safe to
          # surface through $GITHUB_OUTPUT for downstream `if:` and step args.
          {
            echo "type=$(jq -r '.type' <<<"$TASK")"
            echo "branch=$(jq -r '.branch // ""' <<<"$TASK")"
            echo "base_branch=$(jq -r '.baseBranch // ""' <<<"$TASK")"
            echo "model=$(jq -r '.model // ""' <<<"$TASK")"
            echo "step_index=$(jq -r '.step_index // ""' <<<"$TASK")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.github-token }}
          ref: ${{ steps.load.outputs.base_branch || steps.load.outputs.branch || '' }}

      - name: Configure git
        run: |
          git config user.name "hud-bot"
          git config user.email "bot@hud.io"

      - name: Create feature branch
        if: steps.load.outputs.branch && steps.load.outputs.base_branch
        run: |
          git checkout -b "${{ steps.load.outputs.branch }}"
          git push -u origin "${{ steps.load.outputs.branch }}"

      - uses: actions/checkout@v4
        with:
          repository: code-hud/agent-runner
          path: .agent-runner
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent dependencies
        working-directory: .agent-runner
        run: npm install --ignore-scripts

      - name: Install Bun
        if: inputs.mcp-runner == 'bunx'
        uses: oven-sh/setup-bun@v2

      - name: Resolve Hud tokens (GitHub OIDC)
        id: hud-tokens
        run: node .agent-runner/fetch-tokens.js
        env:
          HUD_BASE_URL: ${{ inputs.base-url || 'https://api-prod.hud.io' }}
          HUD_AUDIENCE: ${{ inputs.hud-audience }}

      - name: Run agent
        if: steps.load.outputs.type == 'agent'
        id: agent
        timeout-minutes: 60
        run: node .agent-runner/agent.js
        env:
          # File-based contract: agent.js reads its prompt / resultSchema from
          # the task file and writes the result to HUD_RESULT_FILE. Freeform
          # values never cross $GITHUB_OUTPUT or env: blocks (both scanned by
          # the runner's secret masker).
          HUD_TASK_FILE: ${{ env.TASK_FIELDS_DIR }}/task.json
          HUD_RESULT_FILE: ${{ env.TASK_FIELDS_DIR }}/result.json
          HUD_MODEL: ${{ steps.load.outputs.model }}
          HUD_ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          # When hud-mcp-key is provided, hud-mcp uses HUD_MCP_KEY and the
          # OIDC-derived HUD_ACCESS_TOKEN is skipped for the MCP. Workflow
          # Manager calls (fetch/report) keep using the OIDC token above.
          HUD_MCP_KEY: ${{ secrets.hud-mcp-key }}
          HUD_ACCESS_TOKEN: ${{ secrets.hud-mcp-key == '' && steps.hud-tokens.outputs.general_token || '' }}
          HUD_MCP_BASE_URL: ${{ inputs.mcp-base-url || inputs.base-url || 'https://api-prod.hud.io' }}
          HUD_MCP_BINARY: ${{ github.workspace }}/.agent-runner/mcp.js
          HUD_MCP_RUNNER: ${{ inputs.mcp-runner }}
          HUD_MCP_VERSION: ${{ inputs.mcp-version }}
          HUD_AGENT_EXTRA_ENV: ${{ inputs.extra-env }}
          LANGFUSE_SECRET_KEY: ${{ secrets.langfuse-secret-key }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.langfuse-public-key }}
          LANGFUSE_BASE_URL: 'https://cloud.langfuse.com'

      # The Claude Agent SDK's MCP client does not pipe MCP child stderr to
      # the parent step, so a crashed `hud-mcp` (e.g. m2m login failure on
      # startup) is invisible from the agent step's output. Dump the MCP's
      # own log file and any crash logs it wrote to disk so they show up
      # in the GitHub Actions log here.
      - name: Dump hud-mcp logs
        if: always() && steps.load.outputs.type == 'agent'
        run: |
          LOGS_DIR="$HOME/.hud/logs"
          echo "::group::hud-mcp logs directory listing ($LOGS_DIR)"
          if [ -d "$LOGS_DIR" ]; then
            ls -la "$LOGS_DIR"
          else
            echo "$LOGS_DIR does not exist — hud-mcp never wrote any log files."
          fi
          echo "::endgroup::"

          MCP_LOG="$LOGS_DIR/mcp.log"
          echo "::group::hud-mcp normal log ($MCP_LOG)"
          if [ -s "$MCP_LOG" ]; then
            cat "$MCP_LOG"
          else
            echo "$MCP_LOG missing or empty — hud-mcp never reached the winston file transport (likely crashed before/at startup)."
          fi
          echo "::endgroup::"

          echo "::group::hud-mcp crash logs ($LOGS_DIR/mcp-crash-*.log)"
          shopt -s nullglob
          CRASHES=("$LOGS_DIR"/mcp-crash-*.log)
          if [ ${#CRASHES[@]} -eq 0 ]; then
            echo "No mcp-crash-*.log files — hud-mcp's top-level catch never fired."
          else
            for f in "${CRASHES[@]}"; do
              echo "----- $f -----"
              cat "$f"
            done
          fi
          echo "::endgroup::"

      - name: Commit and push
        id: commit_push
        if: steps.load.outputs.type == 'agent' && steps.load.outputs.branch
        run: |
          git add -A -- ':!.agent-runner'
          if ! git diff --cached --quiet; then
            git commit -m "workflow step ${{ steps.load.outputs.step_index }}" --no-verify
          fi
          git push origin "${{ steps.load.outputs.branch }}" --no-verify

      - name: Create PR
        if: steps.load.outputs.type == 'create_pr'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          TASK_FILE: ${{ env.TASK_FIELDS_DIR }}/task.json
        run: |
          BODY_FILE=$(mktemp)
          jq -r '.body // ""' "$TASK_FILE" > "$BODY_FILE"
          PR_URL=$(gh pr create \
            --head "${{ steps.load.outputs.branch }}" \
            --title "$(jq -r '.title // ""' "$TASK_FILE")" \
            --body-file "$BODY_FILE")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Report task result
        if: always()
        env:
          HUD_TOKEN: ${{ steps.hud-tokens.outputs.workflow_manager_token }}
          TASK_TYPE: ${{ steps.load.outputs.type }}
          TASK_ID: ${{ matrix.task_id }}
          BASE_URL: ${{ inputs.base-url || 'https://api-prod.hud.io' }}
          CREATE_PR_OUTCOME: ${{ steps.create_pr.outcome }}
          CREATE_PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          COMMIT_OUTCOME: ${{ steps.commit_push.outcome }}
          RESULT_FILE: ${{ env.TASK_FIELDS_DIR }}/result.json
        run: |
          if [ "$TASK_TYPE" = "create_pr" ]; then
            if [ "$CREATE_PR_OUTCOME" = "success" ] && [ -n "$CREATE_PR_URL" ]; then
              jq -nc --arg u "$CREATE_PR_URL" '{status:"finish",result:{pr_url:$u}}' > "$RESULT_FILE"
            else
              jq -nc --arg o "$CREATE_PR_OUTCOME" \
                '{status:"crash",error:("gh pr create did not succeed: outcome=" + $o)}' > "$RESULT_FILE"
            fi
          elif [ "$TASK_TYPE" = "agent" ] && [ "$COMMIT_OUTCOME" = "failure" ]; then
            # Agent finished but commit/push failed - override the agent's
            # result so the task is reported as crashed rather than finished.
            jq -nc --arg o "$COMMIT_OUTCOME" \
              '{status:"crash",error:("git commit/push did not succeed: outcome=" + $o)}' > "$RESULT_FILE"
          elif [ ! -s "$RESULT_FILE" ]; then
            echo '{"status":"crash"}' > "$RESULT_FILE"
          fi
          curl -s -f -X POST \
            -H "Authorization: Bearer $HUD_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RESULT_FILE" \
            "$BASE_URL/workflow-manager/tasks/$TASK_ID/update"
